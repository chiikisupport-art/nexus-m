<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS KATANA 確認版</title><style>html,body{margin:0;background:#000;color:#ddd;font:14px sans-serif}#status{position:fixed;top:45%;width:100%;text-align:center}</style></head><body><div id="status">KATANA 読み込み中…</div><script>(async()=>{try{const n=33;const parts=await Promise.all(Array.from({length:n},(_,i)=>fetch('./part-'+String(i).padStart(3,'0')+'.txt',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('読み込み '+i+' HTTP '+r.status);return r.text()})));const html=parts.join('');if(!html.startsWith('<!doctype html>')||!html.includes('</html>'))throw Error('HTML不完全');document.open();document.write(html);document.close()}catch(e){document.getElementById('status').textContent='読み込み失敗: '+e.message}})();</script></body></html>
