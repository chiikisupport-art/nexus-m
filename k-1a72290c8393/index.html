    var nxL = document.getElementById("nxL"); if (nxL) nb.appendChild(nxL);

    olds.forEach(function (o) { if (o.parentNode) o.parentNode.removeChild(o); });

      var ph = pend[pi][0], old = pend[pi][1], sc = document.createElement('script');
